name: Build Binaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
      - '!no-build-**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android32
            target: export-android32
          - platform: android64
            target: export-android64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract commit hash
        id: commit
        run: echo "hash=$(git describe --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: setup-buildx

      - name: Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: cache-mount
          key: cache-mount-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            cache-mount-${{ matrix.platform }}-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/cpm-${{ matrix.platform }}": {
                "id":"cpm-${{ matrix.platform }}",
                "target":"/var/cache-target"
              },
              "cache-mount/sccache-${{ matrix.platform }}": {
                "id":"sccache-${{ matrix.platform }}",
                "target":"/var/cache-target"
              }
            }
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build platform
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          outputs: type=local,dest=./out/${{ matrix.platform }}
          cache-from: type=gha,scope=geode-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=geode-${{ matrix.platform }}
          build-contexts: |
            bindings=https://github.com/geode-sdk/bindings.git#main
          # keeps bindings's .git/ folder so loader can embed the commit hash
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            GEODE_COMMIT_HASH=${{ steps.commit.outputs.hash }}
          provenance: false

      - name: Verify expected output
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            android32)
              test -f out/android32/Geode.android32.so
              ;;
            android64)
              test -f out/android64/Geode.android64.so
              ;;
            ios)
              test -f out/ios/Geode.ios.dylib
              ;;
            macm1)
              test -f out/macm1/Geode.dylib
              test -f out/macm1/GeodeBootstrapper.dylib
              test -f out/macm1/libfmod.dylib
              ;;
            macintel)
              test -f out/macintel/Geode.dylib
              test -f out/macintel/GeodeBootstrapper.dylib
              test -f out/macintel/libfmod.dylib
              ;;
            win)
              test -f out/win/Geode.dll
              test -f out/win/GeodeUpdater.exe
              ;;
          esac

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.platform }}
          path: out/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Android nightly
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Declare version variables
        id: ref
        run: |
          echo "version=$(cat VERSION | xargs)" >> "$GITHUB_OUTPUT"
          echo "hash=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: geode-android32
          path: artifacts/geode-android32

      - uses: actions/download-artifact@v4
        with:
          name: geode-android64
          path: artifacts/geode-android64

      - name: Zip Android 32-bit artifacts
        run: |
          cd artifacts/geode-android32
          zip -j "../../geode-${{ steps.ref.outputs.hash }}-android32.zip" Geode.android32.so

      - name: Zip Android 64-bit artifacts
        run: |
          cd artifacts/geode-android64
          zip -j "../../geode-${{ steps.ref.outputs.hash }}-android64.zip" Geode.android64.so

      - name: Zip Android resources
        run: |
          cd artifacts/geode-android64
          zip -r "../../resources.zip" resources

      - name: Update Android development release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: android-nightly
          name: Android Development Release
          body: |
            Android-only Geode development release for commit ${{ github.sha }}.
            Includes 32-bit and 64-bit Android loader binaries and resources.
          files: |
            ./geode-${{ steps.ref.outputs.hash }}-android32.zip
            ./geode-${{ steps.ref.outputs.hash }}-android64.zip
            ./resources.zip
